; stl_allocator PlatformIO example, also the board build matrix.
;
;   pio run                          build every board below
;   pio run -e esp32dev              build one board
;   pio run -e esp32dev -t upload -t monitor
;   pio run -e native -t exec        build and run on the desktop
;
; Copying this example into your own project? Change lib_deps to
;   lib_deps = endurodave/stl_allocator@^1.1.0
; (here it points at this repository so every commit is tested). Either way
; xallocator, which provides the fixed blocks, comes from the registry as a
; dependency (see library.json).
;
; xallocator locks with std::mutex where the C++ library has it (ESP32,
; desktop). Bare-metal cores (STM32, Pico) have none and default to no lock.
; With an RTOS, add its lock option, e.g. build_flags = -DXALLOC_LOCK_FREERTOS
; (also THREADX, ZEPHYR, CMSIS_RTOS2; see xallocator's README, Porting Issues).

[env]
lib_deps = symlink://../../..
monitor_speed = 115200

; ESP32 (Xtensa, FreeRTOS)
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; ESP32-C3 (RISC-V, FreeRTOS)
[env:esp32-c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino

; STM32 Nucleo-F401RE (Cortex-M4, bare metal)
[env:nucleo_f401re]
platform = ststm32
board = nucleo_f401re
framework = arduino

; STM32F4 Discovery (STM32F407VG Cortex-M4, bare metal)
; Flashed over its ST-LINK/V2, which has no USB serial port: Serial goes to
; USART6 (TX PC6, RX PC7), 115200 8N1, through a 3.3 V USB-UART adapter.
[env:disco_f407vg]
platform = ststm32
board = disco_f407vg
framework = arduino
upload_protocol = stlink
build_flags = -DSERIAL_UART_INSTANCE=6 -DPIN_SERIAL_TX=PC6 -DPIN_SERIAL_RX=PC7

; Raspberry Pi Pico (RP2040 Cortex-M0+, bare metal)
[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
board_build.core = earlephilhower
framework = arduino

; Desktop (Linux, macOS, or Windows with MinGW)
[env:native]
platform = native
