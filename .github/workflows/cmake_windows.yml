name: Windows

on:
  push:
    branches:
      - master  # Trigger on push to 'master' branch
  pull_request:
    branches:
      - master  # Trigger on pull request targeting 'master' branch

jobs:
  build:
    runs-on: windows-2022  # Pinned: windows-latest no longer has Visual Studio 2022

    steps:
    - name: Checkout code
      uses: actions/checkout@v7  # Checkout the repository code

    - name: Configure CMake
      run: cmake -S . -B build  # Default generator: the installed Visual Studio

    - name: Build
      run: cmake --build build --config Release  # Build the project using CMake with Release configuration

    - name: Run stl_allocator_app
      run: .\build\Release\stl_allocator_app.exe  # Run the demos and unit tests; non-zero exit on failure
